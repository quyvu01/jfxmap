name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      # The benchmarks compile, and every library module and the BOM still publish (not run, not uploaded)
      - run: ./gradlew :benchmarks:jmhJar publishToMavenLocal
      # The Maven Central bundle release.yml uploads, signed here with a throwaway key: every module is in it with its
      # sources, javadoc, signatures and checksums, and each signature verifies
      - name: Build and check the Maven Central bundle
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --passphrase ci --quick-gen-key "jfxmap ci <ci@example.invalid>" rsa4096 sign never
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback --passphrase ci --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=ci
          ./gradlew verifyCentralBundle -Pversion=0.0.0-ci
          bundle=$(mktemp -d)
          unzip -q build/central-bundle.zip -d "$bundle"
          find "$bundle" -name '*.asc' -print0 | while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}" 2>/dev/null || { echo "::error::Bad signature $signature"; exit 1; }
          done
          # The SNAPSHOT version of a plain build must not make a bundle
          if ./gradlew centralBundle -q; then echo "::error::centralBundle took a SNAPSHOT version"; exit 1; fi

  # The run scripts of the samples, on each OS they support: start both services and check /orders
  sample-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os != 'Windows'
        run: samples/run.sh --check
      - if: runner.os == 'Windows'
        shell: cmd
        run: samples\run.cmd -Check

  # samples/dotnet-java-nats: a .NET service (FxMap, EF Core) and a Java one (jfxmap, JPA) mapping each other over NATS
  sample-dotnet-java-nats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: gradle/actions/setup-gradle@v4
      - run: dotnet test samples/dotnet-java-nats/catalog-service-tests
      - run: dotnet publish samples/dotnet-java-nats/catalog-service -c Release -o samples/dotnet-java-nats/build/catalog-service
      - run: ./gradlew :samples:dotnet-java-nats:integration-test:test
        env:
          JFXMAP_SAMPLE_CATALOG: dotnet ${{ github.workspace }}/samples/dotnet-java-nats/build/catalog-service/CatalogService.dll
      - run: samples/dotnet-java-nats/run.sh --check
      - run: pwsh samples/dotnet-java-nats/run.ps1 -Check
      # local_run.sh, on a PostgreSQL and a NATS that already run (here those of docker-compose.yml)
      - run: |
          docker compose -f samples/dotnet-java-nats/docker-compose.yml up -d --wait
          PG_PORT=5433 PG_PASSWORD=postgres samples/dotnet-java-nats/local_run.sh --check

  # Java and .NET FxMap 5.1.1 asking each other over NATS, RabbitMQ, Kafka, SQS and Service Bus (interop/)
  dotnet-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: gradle/actions/setup-gradle@v4
      - run: dotnet publish interop/dotnet-probe -c Release -o interop/dotnet-probe/out
      - run: ./gradlew :interop:test
        env:
          JFXMAP_DOTNET_PROBE: dotnet ${{ github.workspace }}/interop/dotnet-probe/out/DotnetProbe.dll
