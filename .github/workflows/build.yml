name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      # The benchmarks compile, and every library module and the BOM still publish (not run, not uploaded)
      - run: ./gradlew :benchmarks:jmhJar publishToMavenLocal publishAllPublicationsToStagingRepository

  # The run scripts of the samples, on each OS they support: start both services and check /orders
  sample-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os != 'Windows'
        run: samples/run.sh --check
      - if: runner.os == 'Windows'
        shell: cmd
        run: samples\run.cmd -Check

  # Java and .NET FxMap 5.1.1 asking each other over NATS, RabbitMQ, Kafka, SQS and Service Bus (interop/)
  dotnet-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: gradle/actions/setup-gradle@v4
      - run: dotnet publish interop/dotnet-probe -c Release -o interop/dotnet-probe/out
      - run: ./gradlew :interop:test
        env:
          JFXMAP_DOTNET_PROBE: dotnet ${{ github.workspace }}/interop/dotnet-probe/out/DotnetProbe.dll
