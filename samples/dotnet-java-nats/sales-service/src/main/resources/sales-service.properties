spring.application.name=sales-service
server.port=8090
# The PostgreSQL of docker-compose.yml; Flyway creates the tables and seeds them (db/migration), Hibernate only checks
spring.datasource.url=jdbc:postgresql://localhost:5433/sales
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# jfxmap answers "CustomerOf" over NATS, and asks catalog-service (.NET) for "ProductOf" over NATS
jfxmap.nats.url=nats://localhost:4222
jfxmap.throw-if-exception=true

# GraphQL on /graphql (schema in graphql/schema.graphqls), with GraphiQL on /graphiql to try it;
# Swagger UI on /swagger-ui.html (springdoc), the OpenAPI document on /v3/api-docs
spring.graphql.graphiql.enabled=true

# Each SQL statement Hibernate runs (jfxmap's JPA handler included), formatted, with the values of its parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
