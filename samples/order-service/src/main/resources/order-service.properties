spring.application.name=order-service
server.port=8082
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Where the owners of the keys this service maps are: the user service's gRPC server
jfxmap.grpc.client.hosts=http://localhost:9091
jfxmap.throw-if-exception=true
