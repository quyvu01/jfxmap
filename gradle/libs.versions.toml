[versions]
jackson = "2.19.2"
junit = "5.13.4"
assertj = "3.27.4"
jakarta-persistence = "3.2.0"
hibernate = "7.4.5.Final"
h2 = "2.4.240"
postgresql = "42.7.7"
grpc = "1.83.1"
protobuf = "4.35.1"
protobufPlugin = "0.9.5"
spring-boot = "4.1.1"
mongodb = "5.8.1"
nats = "2.26.4"
rabbitmq = "5.30.0"
kafka = "4.2.1"
testcontainers = "2.0.5"
awssdk = "2.57.0"
azure-servicebus = "7.18.1"
graphql-java = "25.0"
spring-graphql = "2.0.5"
mssql-jdbc = "13.4.0.jre11"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
jnats = { module = "io.nats:jnats", version.ref = "nats" }
rabbitmq-amqp-client = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
testcontainers-azure = { module = "org.testcontainers:testcontainers-azure" }
testcontainers-mssqlserver = { module = "org.testcontainers:testcontainers-mssqlserver" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-jdbc" }
awssdk-sqs = { module = "software.amazon.awssdk:sqs", version.ref = "awssdk" }
azure-servicebus = { module = "com.azure:azure-messaging-servicebus", version.ref = "azure-servicebus" }
graphql-java = { module = "com.graphql-java:graphql-java", version.ref = "graphql-java" }
spring-graphql = { module = "org.springframework.graphql:spring-graphql", version.ref = "spring-graphql" }
spring-boot-graphql = { module = "org.springframework.boot:spring-boot-graphql" }
spring-web = { module = "org.springframework:spring-web" }
reactor-core = { module = "io.projectreactor:reactor-core" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
