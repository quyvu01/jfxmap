[versions]
jackson = "2.19.2"
junit = "5.13.4"
assertj = "3.27.4"
jakarta-persistence = "3.2.0"
hibernate = "7.4.5.Final"
h2 = "2.4.240"
grpc = "1.83.1"
protobuf = "4.35.1"
protobuf-plugin = "0.9.5"
spring-boot = "4.1.1"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
